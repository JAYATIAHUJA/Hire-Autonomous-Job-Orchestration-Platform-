name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: hire
          POSTGRES_PASSWORD: hire
          POSTGRES_DB: hire
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hire -d hire" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit and API tests (hermetic, SQLite)
        run: pytest -q
      - name: Migrations apply, match the models, and roll back
        env:
          DATABASE_URL: postgresql+psycopg://hire:hire@localhost:5432/hire
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  mock-ats:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab/mock-ats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose.yml is valid
        run: python scripts/dev.py --help >/dev/null && python -c "import sys; sys.path.insert(0, 'scripts'); import dev; dev.ensure_env()" && docker compose config --quiet
